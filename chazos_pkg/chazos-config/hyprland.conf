# Chazos Hyprland Config
# Mimics Zellij behavior using Hyprland submaps.

monitor=,preferred,auto,auto

input {
    kb_layout = us
    follow_mouse = 1
}

general {
    gaps_in = 5
    gaps_out = 20
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 10
}

animations {
    enabled = yes
}

dwindle {
    pseudotile = yes
    preserve_split = yes
}
# Master
master {
    new_status = master
}

# --- ENV VARS (Nvidia & Wayland) ---
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = WLR_NO_HARDWARE_CURSORS,1

# Variables
$mainMod = SUPER
$term = kitty

# --- MODAL SYSTEM ---

# Pane Mode (Super+P)
bind = $mainMod, P, submap, pane
submap = pane
# Focus (Vim style)
bind = , h, movefocus, l
bind = , j, movefocus, d
bind = , k, movefocus, u
bind = , l, movefocus, r
# Moving panes (Vim style)
bind = SHIFT, h, movewindow, l
bind = SHIFT, j, movewindow, d
bind = SHIFT, k, movewindow, u
bind = SHIFT, l, movewindow, r
# Actions
bind = , n, exec, $term
bind = , d, splitratio, 0.5 # Basic split, might need more refinement
bind = , x, killactive
bind = , f, fullscreen, 0
# Return to default mode
bind = , catchall, submap, reset # Escape/Enter/Etc to exit
submap = reset

# Tab Mode (Super+T)
bind = $mainMod, T, submap, tab
submap = tab
# Moving between tabs (workspaces)
bind = , h, workspace, m-1
bind = , l, workspace, m+1
# New Tab
bind = , n, exec, hyprctl dispatch workspace $(hyprctl workspaces -j | jq 'map(.id) | max + 1') && hyprctl dispatch exec $term
# Close Tab (Kill active window)
bind = , x, killactive
# Quick Jump
bind = , 1, workspace, 1
bind = , 2, workspace, 2
bind = , 3, workspace, 3
bind = , 4, workspace, 4
bind = , 5, workspace, 5
bind = , 6, workspace, 6
bind = , 7, workspace, 7
bind = , 8, workspace, 8
bind = , 9, workspace, 9
# Return to default mode
bind = , catchall, submap, reset
submap = reset

# Basic keybindings
bind = $mainMod, RETURN, exec, $term
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,

# Workspace management
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move focused container to tab
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4

# Services
exec-once = waybar -c /etc/skel/.config/waybar/top.jsonc -s /etc/skel/.config/waybar/style.css
exec-once = waybar -c /etc/skel/.config/waybar/bottom.jsonc -s /etc/skel/.config/waybar/style.css
exec-once = $term --hold chazos-welcome
